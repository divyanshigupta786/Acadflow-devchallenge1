version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acadflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: acadflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: acadflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acadflow-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/acadflow
      - JWT_SECRET=acadflow_production_jwt_secret_token_2026
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:7b
      - OLLAMA_BASE_URL=http://ollama:11434
      - STORAGE_PATH=/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acadflow-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
  backend_storage:
